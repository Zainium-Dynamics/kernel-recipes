name: kernel bump

# Every Monday at 10:00 Pakistan time (05:00 UTC), or by hand: when kernel.org has
# a newer Linux or linux-surface changed its patches, and every patch applies, the
# kernel recipe is updated on a branch, a pull request is opened and CI builds and
# boot-tests it there. Merging the pull request publishes it. A push made with the
# workflow's own token starts no workflow by itself, so CI is started explicitly.
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: kernel-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Look for a newer Linux and linux-surface patches, check them all
        id: bump
        run: sh ci/kernel-bump.sh

      - name: Open a pull request and start CI on it
        if: steps.bump.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
          PACKAGE: ${{ steps.bump.outputs.package }}
        run: |
          branch="kernel-$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "$PACKAGE: $VERSION"
          git push -f origin "$branch"
          gh workflow run ci.yml --ref "$branch"
          gh pr view "$branch" >/dev/null 2>&1 || gh pr create --base master --head "$branch" \
            --title "$PACKAGE: $VERSION" \
            --body "Linux and the linux-surface patches, checked to apply. Merging publishes it."
