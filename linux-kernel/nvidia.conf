# NVIDIA's own kernel modules are in the base, but nouveau (with Mesa's NVK) stays the
# driver by default: the COSMIC desktop draws with Mesa, which can not use NVIDIA's.
#
# To use NVIDIA's driver instead (for Flatpak games and apps, with Flathub's GL.nvidia
# extension), an admin creates /overlayer/syshub/etc/modprobe.d/nvidia.conf. A file of the
# same name there replaces this one, so it only needs:
#
#   blacklist nouveau
#
# and a restart.
blacklist nvidia
blacklist nvidia_drm
blacklist nvidia_modeset
blacklist nvidia_uvm
